name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Testes de integração - API Node.js
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências do backend
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Verificar sintaxe
        run: node --check backend/server.js

      - name: Executar testes de integração
        working-directory: backend
        run: npm test

  frontend:
    name: Testes e build React
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Executar testes de interface
        working-directory: frontend
        run: npm test

      - name: Gerar build
        working-directory: frontend
        run: npm run build

  docker:
    name: Build da imagem Docker de demonstração
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Construir a imagem usada pelo Render
        run: docker build --tag rack-monitor-demo .
