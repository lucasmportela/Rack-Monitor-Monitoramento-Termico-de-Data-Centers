name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Testes de integração - API Node.js
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências do backend
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Verificar sintaxe
        run: node --check backend/server.js

      - name: Executar testes de integração
        working-directory: backend
        run: npm test

  frontend:
    name: Testes e build React
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Executar testes de interface
        working-directory: frontend
        run: npm test

      - name: Gerar build
        working-directory: frontend
        run: npm run build

  docker:
    name: Build da imagem Docker de demonstração
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Construir a imagem usada pelo Render
        run: docker build --tag rack-monitor-demo .

      - name: Iniciar contêiner e validar /api/health
        run: |
          docker run --detach --name rack-monitor-ci --publish 10000:10000 rack-monitor-demo

          for tentativa in $(seq 1 30); do
            if resposta=$(curl --fail --silent http://127.0.0.1:10000/api/health) &&
               echo "$resposta" | grep -q '"status":"ok"'; then
              echo "Health check aprovado: $resposta"
              exit 0
            fi

            echo "Aguardando a API iniciar... tentativa $tentativa/30"
            sleep 2
          done

          echo "A API não respondeu corretamente em /api/health."
          docker logs rack-monitor-ci
          exit 1

      - name: Remover contêiner de teste
        if: always()
        run: docker rm --force rack-monitor-ci || true
